<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">MANI SHANKAR KONA — GitHub Profile Banner</title>
  <desc id="desc">
    Professional GitHub banner for Mani Shankar Kona, a final-year Computer
    Science student focused on software engineering, applied AI,
    cybersecurity and automation.
  </desc>

  <defs>
    <!-- =========================
         CLIPPING
    ========================== -->
    <clipPath id="roundedCanvas">
      <rect width="1200" height="360" rx="20" ry="20"/>
    </clipPath>

    <!-- =========================
         MAIN BACKGROUND
    ========================== -->
    <linearGradient id="backgroundGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>

    <!-- =========================
         ORANGE ACCENT
    ========================== -->
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- =========================
         SUBTLE AMBIENT GLOWS
    ========================== -->
    <radialGradient id="leftGlow" cx="0%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightGlow" cx="100%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- =========================
         BORDER
    ========================== -->
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#30363D" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#30363D" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.35"/>
    </linearGradient>

    <!-- =========================
         TERMINAL PANEL
    ========================== -->
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171C23"/>
      <stop offset="100%" stop-color="#12171D"/>
    </linearGradient>

    <!-- =========================
         SUBTLE GRID PATTERN
    ========================== -->
    <pattern
      id="gridPattern"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#30363D"
        stroke-width="0.7"
        opacity="0.22"
      />
    </pattern>

    <!-- =========================
         SHADOW
    ========================== -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="16"
        flood-color="#000000"
        flood-opacity="0.30"
      />
    </filter>

    <filter id="accentGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ========================================================
       CANVAS
  ========================================================= -->
  <g clip-path="url(#roundedCanvas)">

    <rect
      width="1200"
      height="360"
      fill="url(#backgroundGradient)"
    />

    <rect
      width="1200"
      height="360"
      fill="url(#gridPattern)"
    />

    <rect
      width="680"
      height="360"
      fill="url(#leftGlow)"
    />

    <rect
      x="650"
      width="550"
      height="360"
      fill="url(#rightGlow)"
    />

    <!-- subtle right-side diagonal geometry -->
    <g
      stroke="#F97316"
      stroke-width="1"
      opacity="0.055"
    >
      <line x1="920" y1="-40" x2="1115" y2="390"/>
      <line x1="970" y1="-40" x2="1165" y2="390"/>
      <line x1="1020" y1="-40" x2="1215" y2="390"/>
      <line x1="1070" y1="-40" x2="1265" y2="390"/>
    </g>

    <!-- subtle tiger-inspired claw mark -->
    <g
      fill="none"
      stroke="url(#accentGradient)"
      stroke-linecap="round"
      stroke-width="3.2"
      opacity="0.17"
    >
      <path d="M1100 38 C1114 56 1126 78 1134 105"/>
      <path d="M1123 31 C1139 52 1151 77 1158 105"/>
      <path d="M1147 26 C1163 49 1176 75 1181 105"/>
    </g>

    <!-- left accent bar -->
    <rect
      x="0"
      y="0"
      width="5"
      height="360"
      fill="url(#accentGradient)"
    />

    <!-- ======================================================
         LEFT IDENTITY SECTION
    ======================================================= -->
    <g
      font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    >

      <!-- eyebrow -->
      <text
        x="72"
        y="88"
        font-size="14"
        font-weight="700"
        letter-spacing="3.2"
        fill="#F97316"
      >
        FINAL-YEAR COMPUTER SCIENCE STUDENT
      </text>

      <!-- name -->
      <text
        x="70"
        y="158"
        font-size="53"
        font-weight="750"
        letter-spacing="-1"
        fill="#F0F6FC"
      >
        MANI SHANKAR KONA
      </text>

      <!-- name underline -->
      <rect
        x="72"
        y="181"
        width="112"
        height="4"
        rx="2"
        fill="url(#accentGradient)"
      />

      <!-- positioning -->
      <text
        x="72"
        y="226"
        font-size="18"
        font-weight="500"
        fill="#C9D1D9"
      >
        Software Engineering
        <tspan fill="#6E7681">  ·  </tspan>
        <tspan fill="#FDBA74">Applied AI</tspan>
        <tspan fill="#6E7681">  ·  </tspan>
        <tspan fill="#C9D1D9">Cybersecurity</tspan>
      </text>

      <text
        x="72"
        y="258"
        font-size="18"
        font-weight="500"
        fill="#C9D1D9"
      >
        Automation
        <tspan fill="#6E7681">  ·  </tspan>
        <tspan fill="#FDBA74">Real-world Systems</tspan>
      </text>

      <!-- professional line -->
      <text
        x="72"
        y="310"
        font-size="15"
        fill="#8B949E"
      >
        Building practical systems while strengthening Java, DSA and software engineering.
      </text>
    </g>

    <!-- ======================================================
         VERTICAL DIVIDER
    ======================================================= -->
    <line
      x1="708"
      y1="62"
      x2="708"
      y2="298"
      stroke="#30363D"
      stroke-width="1"
    />

    <circle
      cx="708"
      cy="180"
      r="3"
      fill="#F97316"
      opacity="0.85"
    />

    <!-- ======================================================
         TERMINAL / ENGINEERING PANEL
    ======================================================= -->
    <g filter="url(#softShadow)">

      <rect
        x="752"
        y="67"
        width="380"
        height="226"
        rx="14"
        fill="url(#panelGradient)"
        stroke="#30363D"
        stroke-width="1.2"
      />

      <!-- terminal top bar -->
      <rect
        x="752"
        y="67"
        width="380"
        height="40"
        rx="14"
        fill="#1B2128"
      />

      <path
        d="M752 93 H1132"
        stroke="#30363D"
        stroke-width="1"
      />

      <!-- terminal controls -->
      <circle cx="776" cy="87" r="5" fill="#F97316" opacity="0.85"/>
      <circle cx="794" cy="87" r="5" fill="#F59E0B" opacity="0.72"/>
      <circle cx="812" cy="87" r="5" fill="#8B949E" opacity="0.52"/>

      <text
        x="835"
        y="92"
        font-family="Consolas, Menlo, Courier New, monospace"
        font-size="11"
        fill="#6E7681"
      >
        mani@github:~
      </text>

      <!-- terminal body -->
      <g
        font-family="Consolas, Menlo, Courier New, monospace"
      >

        <text
          x="778"
          y="137"
          font-size="14"
          fill="#F97316"
        >
          $
          <tspan fill="#8B949E"> whoami</tspan>
        </text>

        <text
          x="778"
          y="165"
          font-size="16"
          font-weight="700"
          fill="#F0F6FC"
        >
          MANI SHANKAR KONA
        </text>

        <text
          x="778"
          y="204"
          font-size="14"
          fill="#F97316"
        >
          $
          <tspan fill="#8B949E"> current_focus</tspan>
        </text>

        <text
          x="778"
          y="231"
          font-size="13"
          fill="#C9D1D9"
        >
          software_engineering
        </text>

        <text
          x="778"
          y="254"
          font-size="13"
          fill="#C9D1D9"
        >
          applied_ai
          <tspan fill="#6E7681"> / </tspan>
          cybersecurity
        </text>

        <text
          x="778"
          y="277"
          font-size="13"
          fill="#C9D1D9"
        >
          java
          <tspan fill="#6E7681"> + </tspan>
          dsa
          <tspan fill="#6E7681"> + </tspan>
          automation
        </text>

      </g>

      <!-- terminal accent indicator -->
      <circle
        cx="1103"
        cy="269"
        r="5"
        fill="#F97316"
        opacity="0.75"
        filter="url(#accentGlow)"
      />

    </g>

    <!-- bottom-right micro detail -->
    <text
      x="1127"
      y="329"
      text-anchor="end"
      font-family="Consolas, Menlo, Courier New, monospace"
      font-size="10"
      letter-spacing="1.5"
      fill="#484F58"
    >
      github.com/maninani12
    </text>

  </g>

  <!-- outer border -->
  <rect
    x="0.7"
    y="0.7"
    width="1198.6"
    height="358.6"
    rx="19.3"
    fill="none"
    stroke="url(#borderGradient)"
    stroke-width="1.4"
  />

</svg>
