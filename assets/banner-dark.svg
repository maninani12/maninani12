<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1800"
  height="520"
  viewBox="0 0 1800 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">MANI SHANKAR KONA — GitHub Profile Banner</title>

  <desc id="desc">
    MANI SHANKAR KONA, final-year Computer Science student focused on
    software engineering, applied AI, cybersecurity and automation.
  </desc>

  <defs>

    <!-- ===================================================== -->
    <!-- BACKGROUND -->
    <!-- ===================================================== -->

    <linearGradient id="background" x1="0" y1="0" x2="1800" y2="520">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>

    <!-- ===================================================== -->
    <!-- ACCENT -->
    <!-- ===================================================== -->

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- ===================================================== -->
    <!-- NAME -->
    <!-- ===================================================== -->

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="72%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- ===================================================== -->
    <!-- TERMINAL -->
    <!-- ===================================================== -->

    <linearGradient id="terminalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#10151C"/>
    </linearGradient>

    <!-- ===================================================== -->
    <!-- GLOW -->
    <!-- ===================================================== -->

    <radialGradient id="rightGlow" cx="82%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#F97316" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftGlow" cx="10%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- ===================================================== -->
    <!-- CLIPPING -->
    <!-- ===================================================== -->

    <clipPath id="canvasClip">
      <rect
        x="0"
        y="0"
        width="1800"
        height="520"
        rx="28"
      />
    </clipPath>

    <!-- ===================================================== -->
    <!-- TERMINAL SHADOW -->
    <!-- ===================================================== -->

    <filter id="terminalShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow
        dx="0"
        dy="16"
        stdDeviation="22"
        flood-color="#000000"
        flood-opacity="0.34"
      />
    </filter>

  </defs>


